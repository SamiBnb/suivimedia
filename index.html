  var t0=Date.now(),items=r.list.map(function(ti,i){return mk(cat,ti,String(t0+i))}),idx=0,done=0,found=0,stop=false;
  S.bulkRun={stop:function(){stop=true;upd()}};

  document.getElementById('bact').innerHTML='<button class="btn" data-act="bstop">Arrêter et ajouter le reste tel quel</button>';
  function upd(){
    var el=(Date.now()-t0)/1000,rem=done>=2?el/done*(n-done):Math.max(0,n*PER[cat]/3-el);
    document.getElementById('bpi').style.width=Math.round(done/n*100)+'%';

    var tmp=mk(cat,it.title,it.id),fin=false,tk=setTimeout(function(){if(!fin){fin=true;it.nf=true;res(false)}},25000);
    enrich(cat,tmp).then(function(ok){if(fin)return;fin=true;clearTimeout(tk);if(ok){tmp.nf=false;Object.assign(it,tmp)}else it.nf=true;res(ok)}).catch(function(){if(fin)return;fin=true;clearTimeout(tk);it.nf=true;res(false)})})}

    var ex={},add=[],sk=0;
    S.items.forEach(function(i){if(i.cat===cat){ex[nz(i.title)]=1;if(i.alt)ex[nz(i.alt)]=1}});
    items.forEach(function(it){var ks=[nz(it.title),nz(it.alt)].filter(Boolean);if(ks.some(function(k){return ex[k]})){sk++;return}ks.forEach(function(k){ex[k]=1});add.push(it)});

  if(a==='upto'){var cu=cvOf(it),u=Math.max(0,parseInt(document.getElementById('upto').value)||0);if(cu.total)u=Math.min(u,cu.total);cu.done=[];for(var j=1;j<=u;j++)cu.done.push(j)}
  if(a==='all'){var ca=cvOf(it);ca.done=[];for(var k=1;k<=ca.total;k++)ca.done.push(k)}
  if(a==='none')cvOf(it).done=[];
  if(a==='page'){var pg=Math.max(0,parseInt(document.getElementById('pg').value)||0);it.page=it.total?Math.min(pg,it.total):pg}
  if(a==='seen'){var m=parseHM(document.getElementById('seen').value);it.seen=it.total?Math.min(m,it.total):m}
  auto(it);save();if(S.bk&&(a==='upto'||a==='page'||a==='seen'||a==='pct')){S.bk=false;S.open=null}render()});
document.addEventListener('change',function(e){
  var it=cur();
  if(e.target.id==='srt'){S.sorts[S.cat]=e.target.value;saveSorts();document.getElementById('lst').innerHTML=lst();return}
  if(it&&(e.target.id==='dstart'||e.target.id==='dend')){it[e.target.id==='dstart'?'start':'end']=e.target.value;save();return}
  if(e.target.id==='fi'){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d&&Array.isArray(d.items)&&confirm('Remplacer les données actuelles ?')){S.items=d.items;mig();save();render()}}catch(x){alert('Fichier invalide : choisis un export de cette appli.')}};r.readAsText(f);return}
  if(it&&e.target.id==='tot'){var v=e.target.value;if(it.cat==='jeux'){it.hrs=Math.max(0,parseInt(v)||0);save();return render()}var tg=cvOf(it);tg.total=it.cat==='films'?parseHM(v):Math.max(0,parseInt(v)||0);if(it.cat==='series')syncT(it);if(it.status==='done')fill(it);else if(it.status==='doing')auto(it);save();render()}});
mig();render();syncInit();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.ip=e;var b=document.getElementById('inb');if(b)b.hidden=false});
window.addEventListener('appinstalled',function(){S.ip=null;var b=document.getElementById('inb');if(b)b.hidden=true});
</script>
